# Apache 2.4 VirtualHost example for Windows (XAMPP/WampServer)
# Copy into extra/httpd-vhosts.conf then add `127.0.0.1 shop.local` to C:\Windows\System32\drivers\etc\hosts

<VirtualHost *:80>
    ServerName shop.local
    DocumentRoot "C:/xampp/htdocs/luxe-shop/public"

    <Directory "C:/xampp/htdocs/luxe-shop/public">
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.php
    </Directory>

    ErrorLog "logs/luxe-shop-error.log"
    CustomLog "logs/luxe-shop-access.log" combined
</VirtualHost>
